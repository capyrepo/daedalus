<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ent3.tech — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: .75rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
    }
    .login-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .05em;
      margin-bottom: 1.75rem;
      text-align: center;
    }
    .login-title span { color: #64748b; font-weight: 400; }
    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: .75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: .4rem;
    }
    .field input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: .6rem .85rem;
      border-radius: .4rem;
      font-size: .95rem;
      outline: none;
    }
    .field input:focus { border-color: #3b82f6; }
    .btn-login {
      width: 100%;
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: .65rem;
      border-radius: .4rem;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
    }
    .btn-login:hover { background: #2563eb; }
    .error {
      background: #7f1d1d;
      color: #fca5a5;
      border-radius: .4rem;
      padding: .6rem .85rem;
      font-size: .85rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-title">ent3.tech <span>/ monitor</span></div>
    <form method="POST" action="/login">
      __ERROR__
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn-login" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
